[general]
live_config_reload = true

[terminal]

[scrolling]
history = 100000
multiplier = 4

[selection]
save_to_clipboard = true
semantic_escape_chars = """,│`|:"' ()[]{}<>"""

[terminal.shell]
args = ["--login", "--command", "tmux new-session -A -D -s main"]
program = "/opt/homebrew/bin/fish"

[window]
blur = true
decorations = "transparent"
dynamic_padding = true
opacity = 0.92

[window.dimensions]
columns = 106
lines = 25

[window.padding]
x = 20
y = 22

